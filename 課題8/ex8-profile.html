<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>私の好きなもの</title>
    <link rel="stylesheet" href="ex8.css">
</head>
<body>

    <!-- 共通ナビゲーションバー -->
    <nav>
        <ul>
            <li><a href="ex8-home.html">ホーム</a></li>
            <li><a href="ex8-profile.html" class="active">プロフィール</a></li>
        </ul>
    </nav>

    <!-- ページコンテナ -->
    <div class="container">
        <h1>私の好きなもの</h1>

        <!-- 映画の表セクション -->
        <div class="section">
            <h2><span class="highlight">映画</span>トップ3</h2>
            <table>
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>項目</th>
                        <th>理由</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1位</td>
                        <td>インターステラー</td>
                        <td>壮大な宇宙の描写と、<span class="highlight-text">親子の愛</span>に感動したから。</td>
                    </tr>
                    <tr>
                        <td>2位</td>
                        <td>ショーシャンクの空に</td>
                        <td><span class="highlight-text">希望を捨てない</span>主人公の姿に勇気をもらえた。</td>
                    </tr>
                    <tr>
                        <td>3位</td>
                        <td>きっと、うまくいく</td>
                        <td>笑いと感動があり、<span class="highlight-text">見ていて元気が出る</span>映画。</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 食べ物の表セクション -->
        <div class="section">
            <h2><span class="highlight">食べ物</span>トップ3</h2>
            <table>
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>項目</th>
                        <th>理由</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1位</td>
                        <td>ラーメン</td>
                        <td>特に豚骨ラーメンが好きで、<span class="highlight-text">週に一度は食べたくなる</span>。</td>
                    </tr>
                    <tr>
                        <td>2位</td>
                        <td>寿司</td>
                        <td>新鮮な魚介類の<span class="highlight-text">本来の味</span>を楽しめるから。</td>
                    </tr>
                    <tr>
                        <td>3位</td>
                        <td>焼肉</td>
                        <td><span class="highlight-text">みんなでワイワイ</span>楽しみながら食べられるのが良い。</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
