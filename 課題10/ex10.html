<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介ページ - テーマ切り替え</title>
    <link rel="stylesheet" href="ex10.css">
</head>

<body>

    <!-- テーマ切り替えボタンのセクションを追加 -->
    <div class="theme-switcher">
        <button id="theme-default">デフォルト</button>
        <button id="theme-modern-light">モダンライト</button>
        <button id="theme-cyber-dark">サイバーダーク</button>
        <button id="theme-retro-game">レトロゲーム</button>
    </div>

    <div class="container">
        <h1>My Profile & Skills</h1>

        <!-- Flexboxを適用する親要素 -->
        <div class="flex-container">

            <!-- 子要素1: プロフィール -->
            <section class="profile-card">
                <h2>プロフィール</h2>
                <p><strong>名前:</strong> 山内颯大</p>
                <p><strong>出身地:</strong> 北海道苫小牧市</p>
                <p><strong>好きな言葉:</strong> 給料日まで生き延びるゲーム、それが人生。</p>
                <p><strong>目標:</strong> ゲームを一つ完成させること</p>
            </section>

            <!-- 子要素2: 趣味 -->
            <section class="hobby-card">
                <h2>趣味</h2>
                <ul>
                    <li>ピアノを弾くこと</li>
                    <li>C++を極めること</li>
                    <li>お気に入りの音楽を探すこと</li>
                    <li>お金になりそうなアイデアを見つけること</li>
                </ul>
            </section>

            <!-- 子要素3: スキル -->
            <section class="skill-card">
                <h2>スキル</h2>
                <p>C/C++, C#, Python, java, HTML, CSS,
                    JavaScriptを基礎から学んでいます。最近はライブラリ開発に手を出したり引っ込めたり...。今はC#とC++に熱中しているところです</p>
            </section>
        </div>
    </div>

    <!-- JavaScriptファイルを読み込む -->
    <script src="theme.js"></script>

</body>

</html>
