<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">

    <!-- 表示サイズ設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>自己紹介ページ</title>
    <link rel="stylesheet" href="ex9.css">
</head>

<body>

    <div class="container">
        <h1>My Profile & Skills</h1>

        <!-- Flexboxを適用する親要素 -->
        <div class="flex-container">

            <!-- 子要素1: プロフィール (上段左) -->
            <section class="profile-card">
                <h2>プロフィール</h2>
                <p><strong>名前:</strong> 山内颯大</p>
                <p><strong>出身地:</strong> 北海道苫小牧市</p>
                <p><strong>好きな言葉:</strong> 給料日まで生き延びるゲーム、それが人生。</p>
                <p><strong>目標:</strong> ゲームを一つ完成させること</p>
            </section>

            <!-- 子要素2: 趣味 (上段右) -->
            <section class="hobby-card">
                <h2>趣味</h2>
                <ul>
                    <li>ピアノを弾くこと</li>
                    <li>C++を極めること</li>
                    <li>お気に入りの音楽を探すこと</li>
                    <li>お金になりそうなアイデアを見つけること</li>
                </ul>
            </section>

            <!-- 子要素3: スキル (下段) -->
            <section class="skill-card">
                <h2>スキル</h2>
                <p>C/C++, C#, Python, java, HTML, CSS, JavaScriptを基礎から学んでいます。最近はライブラリ開発に手を出したり引っ込めたり...。今はC#とC++に熱中しているところです</p>
            </section>

        </div>
    </div>

</body>

</html>
